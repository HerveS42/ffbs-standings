name: Mise à jour du classement FFBS

on:
  schedule:
    # 06h00 et 18h00 heure de Paris (UTC+1 ou UTC+2 selon l'heure d'été).
    # Les horaires ci-dessous sont en UTC : 05h00 et 17h00 UTC.
    - cron: "0 5 * * *"
    - cron: "0 17 * * *"
  # Permet aussi de déclencher le script manuellement depuis l'onglet
  # "Actions" du dépôt GitHub, pratique pour tester.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        run: npm install

      - name: Récupérer le classement
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: npm run scrape

      - name: Publier les fichiers de debug (HTML brut de la page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-page
          path: debug/
          if-no-files-found: ignore

      - name: Publier le fichier JSON s'il a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/standings.json
          COMMIT_MSG="Mise à jour automatique du classement"

          if git diff --staged --quiet; then
            echo "Rien à publier."
            exit 0
          fi

          git commit -m "$COMMIT_MSG"

          success=false
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Publication réussie."
              success=true
              break
            fi
            echo "Push refusé (mise à jour concurrente d'un autre workflow) — nouvelle tentative ($attempt/5)..."
            git pull --rebase origin main
            sleep $((RANDOM % 10 + 3))
          done

          if [ "$success" = false ]; then
            echo "Échec de la publication après plusieurs tentatives."
            exit 1
          fi
