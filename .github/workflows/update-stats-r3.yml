name: Mise à jour des statistiques R3

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats-r3:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        run: npm install

      - name: Récupérer les statistiques R3 (équipe ALB)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: node scripts/scrape-stats-r3.js

      - name: Publier le fichier JSON s'il a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats-r3.json 2>/dev/null || true
          COMMIT_MSG="Mise à jour automatique des statistiques R3"

          if git diff --staged --quiet; then
            echo "Rien à publier."
            exit 0
          fi

          git commit -m "$COMMIT_MSG"

          success=false
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Publication réussie."
              success=true
              break
            fi
            echo "Push refusé (mise à jour concurrente d'un autre workflow) — nouvelle tentative ($attempt/5)..."
            git pull --rebase origin main
            sleep $((RANDOM % 10 + 3))
          done

          if [ "$success" = false ]; then
            echo "Échec de la publication après plusieurs tentatives."
            exit 1
          fi
